<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sales Records</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    body {
      padding: 30px;
      background-color: #f9f9f9;
      font-family: 'Segoe UI', sans-serif;
    }
    h3 {
      margin-bottom: 20px;
    }
    .table th {
      background-color: #34495e;
      color: #fff;
    }
    .recent-sale {
      background-color: #eafaf1;
    }
    .search-bar {
      margin-bottom: 15px;
    }
    .btn-export {
      float: right;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <h3>🧾 Sales Records</h3>

  <div class="row mb-3">
    <div class="col-md-6">
      <input type="text" id="searchInput" class="form-control search-bar" placeholder="Search by name, village, or commodity...">
    </div>
    <div class="col-md-6 text-end">
      <button class="btn btn-success btn-export" onclick="exportCSV()">📁 Export CSV</button>
    </div>
  </div>

  <div class="table-responsive">
    <table id="salesTable" class="table table-bordered table-striped align-middle">
      <thead>
        <tr>
          <th>Farmer ID</th>
          <th>Name</th>
          <th>Phone</th>
          <th>Village</th>
          <th>Commodity</th>
          <th>Quantity (kg)</th>
          <th>Price/kg (₹)</th>
          <th>Total Price (₹)</th>
          <th>Timestamp</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    let allSales = [];

    function loadSales() {
      $.get('/api/sales/', function (data) {
        allSales = data;
        renderSales(data);
      });
    }

    function renderSales(sales) {
      const tbody = $('#salesTable tbody');
      tbody.empty();
      const now = new Date();

      sales.forEach(sale => {
        const saleTime = new Date(sale.timestamp);
        const isRecent = (now - saleTime) < (60 * 60 * 1000); // Less than 1 hour old
        const row = `
          <tr class="${isRecent ? 'recent-sale' : ''}">
            <td>${sale.farmer_id}</td>
            <td>${sale.name}</td>
            <td>${sale.phone}</td>
            <td>${sale.village}</td>
            <td>${sale.commodity}</td>
            <td>${sale.quantity_kg}</td>
            <td>₹${sale.price_per_kg}</td>
            <td>₹${sale.total_price}</td>
            <td>${new Date(sale.timestamp).toLocaleString()}</td>
          </tr>
        `;
        tbody.append(row);
      });
    }

    function exportCSV() {
      let csv = 'Farmer ID,Name,Phone,Village,Commodity,Quantity,Price/kg,Total Price,Timestamp\n';
      allSales.forEach(sale => {
        csv += `${sale.farmer_id},${sale.name},${sale.phone},${sale.village},${sale.commodity},${sale.quantity_kg},${sale.price_per_kg},${sale.total_price},${new Date(sale.timestamp).toLocaleString()}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'sales_records.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    $('#searchInput').on('input', function () {
      const query = $(this).val().toLowerCase();
      const filtered = allSales.filter(sale =>
        sale.name.toLowerCase().includes(query) ||
        sale.village.toLowerCase().includes(query) ||
        sale.commodity.toLowerCase().includes(query)
      );
      renderSales(filtered);
    });

    $(document).ready(() => {
      loadSales();
      setInterval(loadSales, 15000); // Refresh every 15 seconds
    });
  </script>

</body>
</html>

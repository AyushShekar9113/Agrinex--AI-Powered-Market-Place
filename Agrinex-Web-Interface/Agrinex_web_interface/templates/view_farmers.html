<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Farmers | AgriNex</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            padding: 20px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
        }
        table.dataTable {
            width: 100%;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            border-collapse: collapse;
        }
        table.dataTable th, table.dataTable td {
            padding: 12px 15px;
        }
        table.dataTable th {
            background-color: #007b5e;
            color: white;
        }
        table.dataTable tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        button {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
        }
        .editBtn {
            background-color: #3498db;
        }
        .deleteBtn {
            background-color: #e74c3c;
        }
        #addFarmerBtn {
            margin-top: 20px;
            background-color: #2ecc71;
        }
        .modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            z-index: 1000;
        }
        .modal input {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .modal label {
            display: block;
        }
        .modal button.closeBtn {
            background-color: #888;
            float: right;
        }
        .modal-visible {
            display: block;
        }
    </style>
</head>
<body>

    <h2>Farmers</h2>

    <table id="farmersTable" class="display">
        <thead>
            <tr>
                <th>Farmer ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>District</th>
                <th>Sub-District</th>
                <th>Village</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <button id="addFarmerBtn">+ Add New Farmer</button>

    <!-- Add Modal -->
    <div id="addModal" class="modal">
        <button class="closeBtn" onclick="$('#addModal').hide()">X</button>
        <form id="addForm">
            <label>Name: <input type="text" id="addName" required></label>
            <label>Phone: <input type="text" id="addPhone" required></label>
            <label>District: <input type="text" id="addDistrict" required></label>
            <label>Sub-District: <input type="text" id="addSubDistrict" required></label>
            <label>Village: <input type="text" id="addVillage" required></label>
            <button type="submit">Add Farmer</button>
        </form>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <button class="closeBtn" onclick="$('#editModal').hide()">X</button>
        <form id="editForm">
            <input type="hidden" id="editId">
            <label>Name: <input type="text" id="editname" required></label>
            <label>Phone: <input type="text" id="editPhone" required></label>
            <label>District: <input type="text" id="editDistrict" required></label>
            <label>Sub-District: <input type="text" id="editSubDistrict" required></label>
            <label>Village: <input type="text" id="editVillage" required></label>
            <button type="submit">Save</button>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script>
        $(document).ready(function() {
            const table = $('#farmersTable').DataTable({
                ajax: '/api/farmers',
                columns: [
                    { data: 'farmer_id' },
                    { data: 'name' },
                    { data: 'phone' },
                    { data: 'district' },
                    { data: 'sub_district' },
                    { data: 'village' },
                    {
                        data: null,
                        render: function(data, type, row) {
                            return `
                                <button class="editBtn" data-id="${row.farmer_id}">Edit</button>
                                <button class="deleteBtn" data-id="${row.farmer_id}">Delete</button>
                            `;
                        }
                    }
                ]
            });

            $('#addFarmerBtn').click(() => $('#addModal').show());

            $('#addForm').submit(function(e) {
                e.preventDefault();
                const data = {
                    name: $('#addName').val(),
                    phone: $('#addPhone').val(),
                    district: $('#addDistrict').val(),
                    sub_district: $('#addSubDistrict').val(),
                    village: $('#addVillage').val()
                };
                $.ajax({
                    url: '/api/farmers',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: () => {
                        $('#addModal').hide();
                        table.ajax.reload();
                        this.reset();
                    }
                });
            });
    // Handle Edit button click
    $('#farmersTable').on('click', '.editBtn', function () {
    const id = $(this).data('id'); // Make sure this contains the correct 'farmer_id'

    $.get(`/api/farmers/${id}`, function (data) {
        $('#editId').val(id);  // Farmer ID for updating
        $('#editname').val(data.name);
        $('#editPhone').val(data.phone);
        $('#editDistrict').val(data.district);
        $('#editSubDistrict').val(data.sub_district);
        $('#editVillage').val(data.village);
        $('#editModal').show();
    });
});

    $('#editForm').submit(function (e) {
    e.preventDefault();

    const id = $('#editId').val(); // Farmer ID
    const updatedData = {
        name: $('#editname').val(),
        phone: $('#editPhone').val(),
        district: $('#editDistrict').val(),
        sub_district: $('#editSubDistrict').val(),
        village: $('#editVillage').val()
    };

    $.ajax({
        url: `/api/farmers/${id}`,
        type: 'PUT',
        contentType: 'application/json',
        data: JSON.stringify(updatedData),
        success: function () {
            $('#editModal').hide();
            $('#editForm')[0].reset();
            table.ajax.reload();  // Reload the DataTable after update
        },
        error: function (xhr) {
            console.error("Error: ", xhr.responseText);
            alert("Error updating farmer details.");
        }
    });
});

            $('#farmersTable').on('click', '.deleteBtn', function() {
                const id = $(this).data('id');
                if (confirm('Are you sure you want to delete this farmer?')) {
                    $.ajax({
                        url: `/api/farmers/${id}`,
                        type: 'DELETE',
                        success: () => {
                            table.ajax.reload();
                        }
                    });
                }
            });
        });
    </script>
</body>
</html>
